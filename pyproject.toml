[build-system]
# hatch-vcs (P2 AC-08) injects the wheel version from the git tag at build
# time. At runtime, ``larkhelm/__init__.py`` falls back to
# ``importlib.metadata.version('larkhelm')`` and finally to
# ``"0.0.0+unknown"`` if no install metadata is available — so a missing
# hatch-vcs in a stripped build env (e.g. third-party rebuild) degrades to a
# valid but explicitly-unknown string instead of crashing import.
requires = ["hatchling", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "larkhelm"
dynamic = ["version"]
description = "Feishu (Lark) AI assistant platform powered by Claude CLI, Gemini CLI & Kimi Code CLI"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["feishu", "lark", "claude", "gemini", "kimi", "ai", "chatbot", "bridge"]
dependencies = [
    "lark-oapi>=1.0,<2",
    "croniter>=1.3",
    "mcp>=1.0",
]

[project.scripts]
larkhelm = "larkhelm.__main__:cli"

[project.urls]
Repository = "https://github.com/taocy001/larkhelm"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]
api-backends = [
    "anthropic>=0.30",
    "google-genai>=0.8",
    "openai>=1.30",
]
voice-local = [
    # faster-whisper — local CPU/GPU STT engine. Pulls ~250MB of torch/ctranslate2;
    # install only if you set voice_engine="faster-whisper" (or voice_enabled=true
    # without overriding the engine, since faster-whisper is the default engine):
    #   pipx install -e ".[voice-local]"
    # Or, post-install:
    #   pipx runpip larkhelm install faster-whisper
    "faster-whisper>=1.2",
]
voice-cloud = [
    # DashScope (Aliyun) Paraformer ASR — opt-in cloud STT engine.
    # Install only if you set voice_engine="dashscope" in config.json:
    #   pipx install -e ".[voice-cloud]"
    # Or, post-install:
    #   pipx runpip larkhelm install dashscope
    "dashscope>=1.20.0",
]
memory-embedding = [
    # Phase D / Phase 2 — optional local ONNX embedding backend for hybrid recall.
    # Install only when you flip `embedding_backend="local"` in config.json:
    #   pipx install -e ".[memory-embedding]"
    # The HTTP backend (`embedding_backend="http"`) does NOT need these deps.
    "onnxruntime>=1.18",
    "numpy>=1.26",
]
metrics = [
    # P2 REQ-01 — Prometheus exposition for /metrics. Optional: when not
    # installed, ``larkhelm.metrics.render_exposition()`` raises
    # ``PrometheusNotInstalled`` and ``health_server._handle_metrics`` falls
    # back to the P1 hand-written text exposition (byte-compatible with
    # master). Flip the operator preference via ``metrics_text_legacy=true``
    # in config.json to force the legacy text path even when prometheus-client
    # IS installed.
    "prometheus-client>=0.20",
]

[project.entry-points."larkhelm.embedding_backends"]
# Third-party embedding backends register here. Example:
#   my-backend = "mypkg.backend:MyEmbedding"
# Placeholder — no built-in entry points; the bundled `local` / `http` / `stub`
# backends are resolved directly by `get_embedding_backend`.

# P2 AC-08: hatch-vcs reads the version from the latest git tag
# (e.g. ``2026.5.0`` → ``2026.5.0``). On a dirty editable tree the
# version becomes ``2026.5.0.dev<N>+g<sha>.dirty`` so operators can
# tell whether a deployed bridge was built from a clean tag or from
# uncommitted work. The runtime fallback lives in
# ``larkhelm/__init__.py``.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+unknown"

[tool.hatch.version.raw-options]
# Match PEP 440 + the historical YYYY.MAJOR.MINOR scheme already in use.
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.hatch.build.hooks.vcs]
# Persist the resolved version into a generated file the package can
# read at runtime when ``importlib.metadata`` is unavailable (e.g.
# vendored copies, source-only checkouts).
version-file = "larkhelm/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["larkhelm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
asyncio_mode = "auto"
# NOTE: ``--cov*`` flags are deliberately NOT in ``addopts``: forcing them on
# every pytest invocation breaks single-file iteration (one file's coverage is
# always ~2-5%, immediately tripping ``--cov-fail-under=55``). CI invokes
# coverage explicitly via ``pytest --cov=larkhelm --cov-fail-under=55``;
# developers run plain ``pytest tests/test_X.py`` and get instant feedback.
addopts = "-ra --strict-markers -v --tb=short"
filterwarnings = [
    "error::DeprecationWarning:larkhelm.*",
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false

[[tool.mypy.overrides]]
module = ["larkhelm.crew_types", "larkhelm.dedup", "larkhelm.concurrency", "larkhelm.log", "larkhelm.token_stats", "larkhelm.chat_state"]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py313"
# One-off test / probe scripts that aren't part of the regular suite.
extend-exclude = [
    "tests/repro_bug_*.py",
    "tests/qa_verify.py",
    "tests/verify_v21_ac.py",
    "tests/ac0*_test.py",
]

[tool.ruff.lint]
# CI starts with the BUG-DETECTOR subset only — rules that catch real
# defects (undefined names, redefinitions, comparison antipatterns).
# Style rules (F401 unused imports, F541 empty f-strings, E402 import
# position, E701 multi-statement lines) are deferred to a future pass
# so CI doesn't go red on day one over 280+ cosmetic violations.
select = [
    "F821",  # undefined name (real bugs; caught 3 in cmd_doc + _message)
    "F811",  # redefinition of unused name
    "E711",  # comparison to None with == / != (should use `is` / `is not`)
    "E712",  # comparison to True/False with ==
    "E714",  # ``not foo is bar`` instead of ``foo is not bar``
    "F632",  # ``is`` comparison with a string/int/tuple literal
]
# Per-file deviations: empty for now; expand as the ratchet tightens.
[tool.ruff.lint.per-file-ignores]
