[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "larkhelm"
dynamic = ["version"]
description = "Feishu (Lark) AI assistant platform powered by Claude CLI, Gemini CLI & Kimi Code CLI"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["feishu", "lark", "claude", "gemini", "kimi", "ai", "chatbot", "bridge"]
dependencies = [
    "lark-oapi>=1.0,<2",
    "croniter>=1.3",
    "mcp>=1.0",
]

[project.scripts]
larkhelm = "larkhelm.__main__:cli"

[project.urls]
Repository = "https://github.com/taocy001/larkhelm"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.hatch.version]
path = "larkhelm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["larkhelm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false

[[tool.mypy.overrides]]
module = ["larkhelm.crew_types", "larkhelm.dedup", "larkhelm.concurrency", "larkhelm.log", "larkhelm.token_stats", "larkhelm.chat_state"]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py313"
